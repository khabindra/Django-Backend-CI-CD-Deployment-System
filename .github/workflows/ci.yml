name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 1. Add permissions so the GITHUB_TOKEN can push to GHCR (GitHub container registry)
permissions:
  contents: read
  packages: write

jobs:
  # --- JOB 1: Lint and Test 
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    # 1. Define the PostgreSQL Service Container
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Wait until postgres is ready before starting steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # 2. Pass env vars to the Django app.
    env:
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: test_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432

    steps:
      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Check your local version with: python --version
          cache: 'pip'  # <-- It magically caches dependencies.

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run Linter
      - name: Run Flake8
        run: flake8 .
      # 5. Migration CHeck 
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      # 6. Run Tests
      - name: Run Django Tests
        run: python manage.py test

  # --- JOB 2: Build and Push Docker Image --- 
  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # We want this to run only if the tests pass, OR we can run it in parallel.
    # Running in parallel is faster, so we don't strictly "need" the test job to finish first.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Log into GitHub Container Registry
      - name: Log in to GHCR
        # ONly run this on the main branch, not on pull requests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Extract metadata for tags 
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      # Build and push the image 
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context:
          # Push ONLY if it's a push to main. For PRs, it just builds to verify.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
