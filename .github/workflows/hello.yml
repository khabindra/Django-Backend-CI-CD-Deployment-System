name: Hello CI

# 1. The Trigger: When should this run?
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 2. The Job: What should we do?
jobs:
  say-hello:
    # Where should this run? GitHub provides this machine for free.
    runs-on: ubuntu-latest

    # 3. The Steps: The actual commands to execute
    steps:
      # Step 1: We must pull our code into the runner first.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Run a simple shell command
      - name: Print greeting
        run: echo "Hello, CI/CD! The workflow is working."

      # Step 3: Print some system info to see what the runner looks like
      - name: Print system info
        run: |
          echo "Operating System:"
          uname -a
          echo "Current Directory:"
          pwd
          echo "Files in directory:"
          ls -la
      - name: Print current date and time
        run: date
